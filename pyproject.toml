[project]
name = "akshara-kit"
version = "0.1.0"
description = "Hybrid intelligent framework for Sinhala document ingestion"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Nimsara2001", email = "mihin.nimsara.2001@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
    "Intended Audience :: Developers",
]
dependencies = [
    "pydantic>=2.0",
    # Required by eye/encoding_normaliser.py (spec Section 6.4). The spec's
    # Section 2 dependency block omits it; that is a spec bug — the package
    # cannot run its own core logic without it.
    "pandukabhaya>=1.0.1",
]

[project.optional-dependencies]
pdf = ["pypdf>=5.0", "pdfplumber>=0.11", "pymupdf>=1.24", "pdfminer.six>=20231228"]
# pillow is listed explicitly: ocr_adapter calls PIL.Image.open directly rather
# than relying on it arriving transitively via pytesseract.
ocr = ["pytesseract>=0.3.10", "pillow>=10.0", "pdf2image>=1.17"]
docx = ["python-docx>=1.1"]
xlsx = ["openpyxl>=3.1"]
sinhala = ["sinlib>=0.1.13"]
# The vision-language fallback. All three SDKs, but each provider imports its
# own lazily, so installing this extra and using only one provider is fine.
multimodal = ["anthropic>=0.40", "openai>=1.60", "google-genai>=1.0"]
all = [
    "akshara-kit[pdf]",
    "akshara-kit[ocr]",
    "akshara-kit[docx]",
    "akshara-kit[xlsx]",
    "akshara-kit[sinhala]",
    "akshara-kit[multimodal]",
]
# The Brain. sentence-transformers pulls in torch, which is large, so this is
# deliberately NOT part of `all` — the rule base and coordinator run without it
# against any CoherenceScorer.
brain = [
    "swiplserver>=1.0",
    "sentence-transformers>=5.4",
]

[project.urls]
Homepage = "https://github.com/Nimsara2001/akshara-kit"
Repository = "https://github.com/Nimsara2001/akshara-kit"
Issues = "https://github.com/Nimsara2001/akshara-kit/issues"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["uv_build>=0.9.14,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ocr: requires the Tesseract binary and the Sinhala 'sin' language pack",
    "poppler: requires poppler-utils (pdftoppm) on PATH",
    "integration: end-to-end route() call over a fixture file",
    "vlm: calls a real vision-language API; needs a key and costs money",
    "prolog: requires a SWI-Prolog binary on PATH",
    "labse: downloads and runs the LaBSE sentence encoder",
]

[tool.coverage.run]
source = ["akshara_kit"]
